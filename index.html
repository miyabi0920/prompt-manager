<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイプロンプト帳</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (アイコン用) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 自分のCSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ヘッダーエリア（上部固定） -->
    <header class="bg-dark text-white p-3 sticky-top shadow-sm">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <h6 class="mb-0"><i class="fas fa-check-double me-1"></i>選択中のプロンプト <small class="text-white-50 ms-2">(クリックでコピー)</small></h6>
                <button id="clear-selection-header-btn" class="btn btn-sm btn-outline-light py-0" title="選択をすべて解除">
                    <i class="fas fa-eraser"></i> クリア
                </button>
            </div>
            <div id="selected-prompts-container" class="p-2 bg-secondary rounded" title="クリックしてコピー">
                <span class="text-white-50">プロンプトを選択してください...</span>
            </div>
        </div>
    </header>

    <!-- メインコンテンツエリア -->
    <main class="container mt-4">
        
        <!-- タイトル＆操作ボタンエリア -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h2 class="mb-0 fs-4 fw-bold">マイプロンプト帳</h2>
            <div class="d-flex flex-wrap gap-2">
                <button id="add-folder-btn" class="btn btn-primary btn-sm"><i class="fas fa-folder-plus"></i> タブ追加</button>
                <button id="save-data-btn" class="btn btn-success btn-sm"><i class="fas fa-save"></i> 手動保存</button>
                <button id="export-btn" class="btn btn-info btn-sm text-white"><i class="fas fa-file-export"></i> エクスポート</button>
                <button id="import-btn" class="btn btn-warning btn-sm text-white"><i class="fas fa-file-import"></i> インポート</button>
                <!-- 全データリセットを一括選択解除に入れ替え -->
                <button id="clear-selection-btn" class="btn btn-danger btn-sm"><i class="fas fa-times-circle"></i> 選択を一括解除</button>
            </div>
        </div>
        
        <!-- インポート用ファイル選択（非表示） -->
        <input type="file" id="import-file-input" accept=".json" style="display: none;">

        <!-- 検索バー（サジェスト候補付き） -->
        <div class="position-relative mb-4">
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
                <input type="text" id="search-input" class="form-control" placeholder="プロンプトや意味を検索...（例: 胸、silver、最高品質）" autocomplete="off">
                <button id="search-clear-btn" class="btn btn-outline-secondary d-none" type="button"><i class="fas fa-times"></i></button>
            </div>
            <!-- 検索候補（これ？リスト）が表示される場所 -->
            <div id="search-suggestions" class="list-group position-absolute w-100 shadow-lg d-none" style="z-index: 1050; max-height: 320px; overflow-y: auto;"></div>
        </div>

        <!-- 横並びタブ（カテゴリ） -->
        <ul class="nav nav-tabs flex-nowrap overflow-x-auto" id="folder-tabs" role="tablist">
            <!-- JSでタブを生成 -->
        </ul>

        <!-- 選択中タブの中身（選択肢エリア） -->
        <div class="tab-content bg-white border border-top-0 rounded-bottom p-3 shadow-sm" id="folder-tab-content">
            <!-- JSでプロンプト選択肢を生成 -->
        </div>

    </main>
    
    <!-- フッター -->
    <footer class="text-center text-muted py-4 mt-4">
        <p class="small">&copy; 2024 My Prompt Manager</p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SortableJSライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <!-- 自分のJavaScript -->
    <script src="script.js"></script>
</body>
</html>
